<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazo Automóveis</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        #busca {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 0 auto 30px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .carros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .carro {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .carro img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .info {
            padding: 15px;
        }

        .info h2 {
            margin-bottom: 10px;
        }

        .info p {
            margin-bottom: 5px;
        }

        .preco {
            color: green;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .whatsapp {
            display: block;
            text-align: center;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .whatsapp:hover {
            background: #1faa55;
        }

        .vazio {
            text-align: center;
            color: #666;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>🚗 Mazo Automóveis</h1>

    <input
        type="text"
        id="busca"
        placeholder="Pesquisar veículo por marca ou modelo">

    <div class="carros" id="carros"></div>

    <script>

        const SUPABASE_URL = "https://jzpshjdwspuslzkhljuz.supabase.co";

        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6cHNoamR3c3B1c2x6a2hsanV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjAzNDcsImV4cCI6MjEwNDU5NjM0N30.WCR4PkCwJpVMijtRboBtIL1QD90c5gVWcY47qer9OUA";

        async function carregarVeiculos() {

            try {

                const resposta = await fetch(
                    `${SUPABASE_URL}/rest/v1/veiculos?select=*`,
                    {
                        headers: {
                            apikey: SUPABASE_KEY,
                            Authorization: `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );

                const veiculos = await resposta.json();

                const textoBusca = document
                    .getElementById('busca')
                    .value
                    .toLowerCase();

                const filtrados = veiculos.filter(v =>
                    `${v.marca} ${v.modelo}`
                        .toLowerCase()
                        .includes(textoBusca)
                );

                const carrosDiv = document.getElementById('carros');

                carrosDiv.innerHTML = '';

                if (filtrados.length === 0) {
                    carrosDiv.innerHTML =
                        `<p class="vazio">Nenhum veículo encontrado.</p>`;
                    return;
                }

                filtrados.forEach(v => {

                    carrosDiv.innerHTML += `
                        <div
    			class="carro"
    			onclick="window.location='detalhes.html?id=${v.id}'"
    			style="cursor:pointer;">

                            <img src="${v.foto_url || 'https://via.placeholder.com/600x400?text=Sem+Foto'}">

                            <div class="info">

                                <h2>${v.marca} ${v.modelo}</h2>

                                <p><strong>Ano:</strong> ${v.ano || ''}</p>

                                <p><strong>KM:</strong> ${v.km || ''}</p>

                                <p><strong>Câmbio:</strong> ${v.cambio || ''}</p>

                                <p><strong>Combustível:</strong> ${v.combustivel || ''}</p>

                                <div class="preco">
                                    R$ ${Number(v.preco).toLocaleString('pt-BR')}
                                </div>

                                <a
                                    class="whatsapp"
                                    target="_blank"
                                    href="https://wa.me/5527999999999?text=Olá, tenho interesse no ${v.marca} ${v.modelo}">
                                    Tenho Interesse
                                </a>

                            </div>

                        </div>
                    `;
                });

            } catch (erro) {

                console.error(erro);

                document.getElementById('carros').innerHTML =
                    "<p class='vazio'>Erro ao carregar veículos.</p>";
            }
        }

        document
            .getElementById('busca')
            .addEventListener('input', carregarVeiculos);

        carregarVeiculos();

    </script>

</body>

</html>
