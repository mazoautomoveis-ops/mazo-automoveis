<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Excluir Veículo com Fotos</title>
    <!-- Inclua o SDK do Supabase aqui se ainda não tiver -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Sua tabela / lista de veículos -->
    <div id="lista-veiculos"></div>

    <script>
        // Substitua pelas suas credenciais do Supabase
        const SUPABASE_URL = "SUA_URL_DO_SUPABASE";
        const SUPABASE_KEY = "SUA_CHAVE_ANON_OU_SERVICE";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Cache local para os veículos carregados
        let estoqueCache = [];

        // Exemplo de função para carregar dados do banco
        async function carregarTabelaEstoque() {
            const { data, error } = await supabase.from('veiculos').select('*');
            if (error) {
                console.error("Erro ao carregar veículos:", error);
                return;
            }
            estoqueCache = data || [];
            
            // Renderização simples para fins de demonstração
            const container = document.getElementById('lista-veiculos');
            container.innerHTML = estoqueCache.map(v => `
                <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                    <h3>${v.modelo || 'Veículo'} (ID: ${v.id})</h3>
                    <button onclick="excluirVeiculo('${v.id}')" style="background: red; color: white; padding: 8px;">
                        Excluir Veículo e Fotos
                    </button>
                </div>
            `).join('');
        }

        // Função para extrair o caminho relativo da imagem dentro do bucket
        function extrairCaminhoBucket(url) {
            if (!url) return null;
            // Pega o caminho após o nome do bucket "fotos-veiculos/"
            const partes = url.split('/fotos-veiculos/');
            if (partes.length > 1) {
                // Decodifica caracteres especiais na URL (como espaços ou símbolos)
                return decodeURIComponent(partes[1]);
            }
            return null;
        }

        // Função Principal: Exclui Veículo e Fotos Associadas
        window.excluirVeiculo = async function(id) {
            if (!confirm("Tem certeza que deseja EXCLUIR permanentemente este veículo e TODAS as suas fotos do banco e do Storage?")) {
                return;
            }

            try {
                // 1. Localiza o veículo no cache ou busca no Supabase
                let v = estoqueCache.find(item => String(item.id) === String(id));

                if (!v) {
                    const { data, error: fetchErr } = await supabase
                        .from('veiculos')
                        .select('*')
                        .eq('id', id)
                        .single();
                    if (fetchErr) throw fetchErr;
                    v = data;
                }

                if (v) {
                    let caminhosParaExcluir = [];

                    // a) Adiciona a Foto Principal / Capa
                    const caminhoCapa = extrairCaminhoBucket(v.foto_url);
                    if (caminhoCapa) {
                        caminhosParaExcluir.push(caminhoCapa);
                    }

                    // b) Adiciona as Fotos da Galeria (se existirem)
                    if (v.fotos_galeria) {
                        let galeria = v.fotos_galeria;
                        
                        // Caso a galeria esteja armazenada como string JSON
                        if (typeof galeria === 'string') {
                            try {
                                galeria = JSON.parse(galeria);
                            } catch (e) {
                                console.warn("Não foi possível converter fotos_galeria de string para JSON:", e);
                            }
                        }

                        // Adiciona cada URL válida da galeria para remoção
                        if (Array.isArray(galeria)) {
                            galeria.forEach(url => {
                                const caminho = extrairCaminhoBucket(url);
                                if (caminho) caminhosParaExcluir.push(caminho);
                            });
                        }
                    }

                    // c) Exclui todos os arquivos acumulados do Storage do Supabase
                    if (caminhosParaExcluir.length > 0) {
                        const { data: storageData, error: storageError } = await supabase
                            .storage
                            .from('fotos-veiculos')
                            .remove(caminhosParaExcluir);

                        if (storageError) {
                            console.warn("Aviso: Erro ao remover algumas fotos do Storage:", storageError.message);
                        } else {
                            console.log("Fotos removidas do Storage com sucesso:", storageData);
                        }
                    }
                }

                // 2. Exclui o registro da tabela 'veiculos'
                const { error: dbError } = await supabase
                    .from('veiculos')
                    .delete()
                    .eq('id', id);

                if (dbError) throw dbError;

                alert("Veículo e suas fotos foram excluídos com sucesso!");
                
                // Recarrega a tabela de estoque na página
                carregarTabelaEstoque();

            } catch (err) {
                console.error("Erro no processo de exclusão:", err);
                alert("Erro ao excluir veículo: " + err.message);
            }
        };

        // Carrega os veículos ao iniciar a página
        carregarTabelaEstoque();
    </script>
</body>
</html>
