<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Mazo Automóveis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .salvar {
            background: #198754;
            color: white;
            width: 100%;
        }

        .logout {
            background: #dc3545;
            color: white;
            float: right;
        }

        .veiculos {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(320px,1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .info {
            padding: 15px;
        }

        .excluir {
            background: #dc3545;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .msg {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="logout" onclick="logout()">
        Sair
    </button>

    <h1>🚗 Administração Mazo Automóveis</h1>

    <div class="formulario">

        <input id="marca" placeholder="Marca">

        <input id="modelo" placeholder="Modelo">

        <input id="ano" placeholder="Ano">

        <input id="km" placeholder="KM">

        <input id="preco" placeholder="Preço">

        <input id="combustivel" placeholder="Combustível">

        <input id="cambio" placeholder="Câmbio">

        <input id="foto_url" placeholder="URL da Foto">

        <textarea
            id="descricao"
            rows="5"
            placeholder="Descrição"></textarea>

        <button
            class="salvar"
            onclick="salvarVeiculo()">
            Salvar Veículo
        </button>

        <div id="mensagem" class="msg"></div>

    </div>

    <div id="veiculos" class="veiculos"></div>

</div>

js/config.jsscript>

<script>

async function carregarVeiculos() {

    const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/veiculos?select=*`,
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const dados = await resposta.json();

    const lista = document.getElementById("veiculos");

    lista.innerHTML = "";

    dados.forEach(v => {

        lista.innerHTML += `
        
        <div class="card">

            <img src="${v.foto_url || 'https://via.placeholder.com/600x400'}">

            <div class="info">

                <h3>${v.marca} ${v.modelo}</h3>

                <p><strong>Ano:</strong> ${v.ano}</p>

                <p><strong>KM:</strong> ${v.km}</p>

                <p><strong>Preço:</strong>
                R$ ${Number(v.preco).toLocaleString('pt-BR')}
                </p>

                <button
                    class="excluir"
                    onclick="excluirVeiculo(${v.id})">
                    Excluir
                </button>

            </div>

        </div>
        `;
    });
}

async function salvarVeiculo() {

    const veiculo = {
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        ano: Number(document.getElementById('ano').value),
        km: Number(document.getElementById('km').value),
        preco: Number(document.getElementById('preco').value),
        combustivel: document.getElementById('combustivel').value,
        cambio: document.getElementById('cambio').value,
        foto_url: document.getElementById('foto_url').value,
        descricao: document.getElementById('descricao').value
    };

    const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/veiculos`,
        {
            method: 'POST',
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                Prefer: 'return=minimal'
            },
            body: JSON.stringify(veiculo)
        }
    );

    if(resposta.ok){

        document.getElementById("mensagem").innerHTML =
        "✅ Veículo cadastrado com sucesso";

        carregarVeiculos();

    } else {

        document.getElementById("mensagem").innerHTML =
        "❌ Erro ao cadastrar veículo";
    }
}

async function excluirVeiculo(id){

    if(!confirm("Deseja excluir este veículo?")){
        return;
    }

    const resposta = await fetch(
        `${SUPABASE_URL}/rest/v1/veiculos?id=eq.${id}`,
        {
            method: 'DELETE',
            headers:{
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    if(resposta.ok){
        carregarVeiculos();
    }
}

function logout(){

    alert("Logout será implementado na próxima etapa.");

}

carregarVeiculos();

</script>

</body>
</html>
